services:
  # Single-node replica set — required by Prisma's MongoDB connector even for
  # one node (it uses transactions for atomic writes/increments).
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: mongosh --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }" --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # maxmemory: prevent unbounded growth — LRU eviction drops oldest completed jobs
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  asterisk:
    image: andrius/asterisk
    ports:
      - "5060:5060/udp"
      - "8088:8088/tcp"
    volumes:
      - ./recordings:/var/spool/asterisk/monitor
      - ./asterisk-config:/etc/asterisk

  # ── Application services added in Phase 5 ──────────────────────────────────
  api-service:
    build: ./api-service
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: mongodb://mongo:27017/aicalling?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  telephony-gateway:
    build: ./telephony-gateway
    ports: ["3001-3002:3001"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DATABASE_URL: mongodb://mongo:27017/aicalling?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      PORT: "3001"
    env_file:
      - .env
    deploy:
      replicas: 2
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  call-worker:
    build: ./call-worker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DATABASE_URL: mongodb://mongo:27017/aicalling?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      MAX_CALLS_PER_TENANT: "5"
    env_file:
      - .env
    deploy:
      replicas: 3
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  call-evaluation-api:
    build: ./call-evaluation-service
    command: npm run start:api
    ports: ["4000:4000"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DATABASE_URL: mongodb://mongo:27017/aicalling?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      PORT: "4000"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  call-evaluation-worker:
    build: ./call-evaluation-service
    command: npm run start:workers
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DATABASE_URL: mongodb://mongo:27017/aicalling?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    deploy:
      replicas: 2
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  # ── API Gateway (NGINX) ────────────────────────────────────────────────────
  # Unifies the REST API (port 3000) and Telephony WebSocket (port 3001)
  # behind a single port (8080) so ngrok only needs one tunnel.
  api-gateway:
    image: nginx:alpine
    ports: ["8080:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api-service, telephony-gateway]

volumes:
  mongodata:
  redisdata:
