<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="AI Caller Pro" />
    <meta name="apple-mobile-web-app-title" content="AI Caller Pro" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Per-page SEO head. Everything between these markers is generated from
         src/seo (pages.js + head.js): the build writes each public page's own
         title, description, canonical, Open Graph/Twitter tags and JSON-LD
         here (scripts/prerender.js), and useSeo() keeps it current on
         client-side navigation. The defaults below only show in dev. -->
    <!-- seo:start -->
    <title>AI Caller Pro — AI Voice Calling &amp; Outbound Campaign Platform</title>
    <meta name="description" content="AI Caller Pro runs outbound phone campaigns with an AI voice agent and scores every call automatically." data-seo />
    <!-- seo:end -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate" type="text/plain" title="LLM-readable summary" href="/llms.txt" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter is the one typeface for the app and the marketing site, requested
         with its optical-size axis so large headings pick up the tighter
         display cut automatically (font-optical-sizing in index.css). The
         weight range stops at 700 — nothing renders heavier. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Material Symbols, pinned to the single cut index.css renders (opsz 24,
         wght 400, GRAD 0) with only FILL left variable — the full axis set is
         several times the download for variations nothing uses. `block` keeps
         icon ligature names (e.g. "expand_more") from flashing as text. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance_wallet,account_tree,add_circle,analytics,arrow_back,arrow_downward,arrow_drop_down,arrow_drop_up,arrow_forward,arrow_upward,article,auto_awesome,bar_chart,call,campaign,cancel,chat,check,check_circle,checklist,chevron_left,chevron_right,close,contact_support,content_copy,corporate_fare,currency_rupee,data_object,delete,delete_sweep,desc,description,down,download,edit,error,expand_more,explore_off,fact_check,file_download,filter_alt,filter_alt_off,filter_list,first_page,flag,forum,gpp_bad,graphic_eq,group,groups,help,history,home,inbox,info,key,last_page,link,link_off,lock,mail,manage_accounts,mark_email_read,mark_email_unread,menu,mic,mood,notes,notifications,open_in_new,pause,pause_circle,payments,pending_actions,percent,person,person_add,person_remove,phone_missed,photo_camera,play_arrow,play_circle,psychology,receipt_long,refresh,restart_alt,rocket_launch,rule,save,science,search,search_off,send,sentiment_dissatisfied,sentiment_neutral,sentiment_satisfied,sentiment_very_satisfied,settings_input_antenna,share,shield,shopping_cart,skull,smart_toy,speed,star,stop,stop_circle,support_agent,table_view,target,task_alt,timer,translate,trending_up,upload_file,verified_user,view_column,visibility,warning,workspaces&display=block" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          // Signed-in visitors are taken straight into the app, so hide the
          // pre-rendered marketing HTML until React mounts instead of
          // flashing it first. Crawlers have no session and see it all.
          if (localStorage.getItem('refreshToken')) document.documentElement.setAttribute('data-session', '');
        } catch (e) {}
      })();
    </script>
    <style>[data-session] #root[data-prerendered] { visibility: hidden; }</style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
